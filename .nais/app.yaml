apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: pam-stilling-feed-admin
  namespace: teampam
  labels:
    team: teampam
spec:
  port: 3000
  liveness:
    path: /internal/isAlive
    initialDelay: 40
  readiness:
    path: /internal/isReady
    initialDelay: 40
  replicas:
    min: 1
    max: 1
    scalingStrategy:
      cpu:
        thresholdPercentage: 50
  resources:
    limits:
      memory: 1536Mi
    requests:
      cpu: 20m
      memory: 384Mi
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
        - id: elastic
      enabled: true
  leaderElection: true
  prometheus:
    enabled: true
    path: /internal/prometheus
  tokenx:
    enabled: true
  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        extra:
          - "NAVident"
    sidecar:
      enabled: true
      autoLogin: true
  accessPolicy:
    outbound:
      rules:
        - application: pam-stilling-feed
        - application: logging
          namespace: nais-system
      external:
        - host: eu.onetimesecret.com
  envFrom:
    - secret: pam-stilling-feed-admin-token
  env:
    - name: STILLING_FEED_BASE_URL
      value: http://pam-stilling-feed
    - name: ONETIMESECRET_BASE_URL
      value: https://eu.onetimesecret.com/
